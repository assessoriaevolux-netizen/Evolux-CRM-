name: Diagnóstico IA (temporário)

# Lê só as linhas "[gemini]" dos logs da função crm-integracoes (sem dados de leads).
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Logs do Gemini
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FIM=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          INI=$(date -u -d '-90 minutes' +%Y-%m-%dT%H:%M:%SZ)
          SQL="select timestamp, event_message from function_logs where event_message like '%[gemini]%' order by timestamp desc limit 30"
          curl -sS -G "https://api.supabase.com/v1/projects/uekeeutycmqsswrhspwv/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$INI" --data-urlencode "iso_timestamp_end=$FIM" \
            > out.json; echo "bytes: $(wc -c < out.json)"
          python3 -c "import json; d=json.load(open('out.json')); print('chaves:', list(d.keys()) if isinstance(d,dict) else type(d)); print('erro:', str(d.get('error') or d.get('message'))[:800] if isinstance(d,dict) else ''); rows=(d.get('result') or []) if isinstance(d,dict) else []; print('linhas:', len(rows)); [print('LOG', r.get('timestamp'), '|', str(r.get('event_message'))[:700]) for r in rows]"
