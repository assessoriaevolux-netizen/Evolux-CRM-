name: Deploy Edge Functions

# Publica no Supabase as funções que mudaram no push (ou todas, se rodar à mão).
# Todas usam --no-verify-jwt porque cada função confere o login por conta própria
# (ou recebe chamadas da Meta / do agendador, que não têm login do CRM).

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar funções
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTES: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          TODAS=$(ls -d supabase/functions/*/ | xargs -n1 basename)
          if [ "$EVENTO" = "workflow_dispatch" ] || [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            LISTA="$TODAS"
          else
            LISTA=$(git diff --name-only "$ANTES" "$GITHUB_SHA" -- supabase/functions | cut -d/ -f3 | sort -u)
          fi
          for f in $LISTA; do
            if [ -f "supabase/functions/$f/index.ts" ]; then
              echo "→ publicando $f"
              supabase functions deploy "$f" --project-ref uekeeutycmqsswrhspwv --no-verify-jwt --yes
            fi
          done
