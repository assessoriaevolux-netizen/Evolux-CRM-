<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Indique seus amigos</title>
<meta property="og:title" content="Indique seus amigos e ganhe prêmios">
<meta property="og:description" content="PIX de R$ 100 a R$ 1.000, parcela paga, almoço VIP e muito mais.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --g:#16a34a; --ge:#15803d; --gs:#f0fdf4; --gb:#dcfce7;
  --bg:#f4f7f5; --card:#ffffff; --bd:hsl(145 14% 88%);
  --tx:hsl(145 30% 9%); --tm:hsl(145 11% 38%); --in:#f8fbf9;
  --err:#dc2626; --err-bg:#fef2f2;
  --hero:linear-gradient(120deg,#0c4a26 0%,#128a40 55%,#22c55e 100%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --g:#22c55e; --ge:#4ade80; --gs:hsl(145 30% 11%); --gb:hsl(145 35% 16%);
  --bg:hsl(145 14% 5%); --card:hsl(145 14% 8%); --bd:hsl(145 11% 16%);
  --tx:hsl(145 10% 94%); --tm:hsl(145 8% 66%); --in:hsl(145 14% 10%);
  --err:#f87171; --err-bg:hsl(0 40% 12%);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(12,74,38,.35)}
.hero{background:var(--hero);color:#fff;padding:26px 22px 22px;text-align:center}
.logo{height:46px;max-width:180px;object-fit:contain;background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:12px}
.emp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
h1{font-size:24px;line-height:1.2;margin:6px 0 6px;font-weight:800;text-wrap:balance}
.hero p{margin:0;font-size:14.5px;opacity:.95}
.body{padding:20px 18px 22px;display:flex;flex-direction:column;gap:18px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tm)}
.pix{display:flex;align-items:center;gap:12px;background:var(--gs);border:1px solid var(--gb);border-radius:14px;padding:14px}
.pix-ic{font-size:28px;line-height:1}
.pix-t{font-size:13px;color:var(--tm)}
.pix-v{font-size:20px;font-weight:800;color:var(--g);line-height:1.15}
.premios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pr{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}
.pr .e{font-size:20px;line-height:1}
.pr .n{font-size:11.5px;font-weight:700;margin-top:5px;line-height:1.25}
.amigos{display:flex;flex-direction:column;gap:10px}
.am{border:1px solid var(--bd);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.am .num{position:absolute;top:-9px;left:12px;background:var(--g);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.am input,.am select{width:100%;min-width:0;font:inherit;font-size:15px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:11px 12px}
.am input:focus,.am select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 18%,transparent)}
.am .full{grid-column:1/-1}
.am.erro input.bad{border-color:var(--err);background:var(--err-bg)}
.btn{appearance:none;border:0;width:100%;background:var(--g);color:#fff;font:inherit;font-size:16px;font-weight:700;border-radius:14px;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.6;cursor:default}
.msg{font-size:13.5px;color:var(--err);background:var(--err-bg);border-radius:10px;padding:10px 12px}
.nota{font-size:12px;color:var(--tm);text-align:center;margin:0}
.estado{padding:40px 22px;text-align:center}
.estado .big{font-size:52px;line-height:1}
.estado h2{font-size:21px;margin:12px 0 6px;text-wrap:balance}
.estado p{color:var(--tm);margin:0}
.rod{font-size:11.5px;color:var(--tm);text-align:center;margin-top:14px}
.load{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (max-width:440px){.am{grid-template-columns:1fr}}
@media (max-width:340px){.premios{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <div class="estado"><span class="load" style="color:var(--g)"></span></div>
  </div>
  <div class="rod">Seus dados e os dos seus amigos são usados só para este contato.</div>
</div>

<script>
(function(){
  // Chave pública do Supabase (feita para ficar no navegador; o acesso é limitado pelas regras do banco)
  var SB_URL='https://uekeeutycmqsswrhspwv.supabase.co';
  var SB_KEY='sb_publishable_nJ-BnFkD8sG8mv4f7Uc-Uw_v87ZOIl9';
  var INTERESSES=['Carro','Imóvel','Moto','Caminhão','Investir','Reforma','Negócio','Outro'];
  var PREMIOS=[['📋','Próxima parcela paga'],['🍽️','Almoço VIP'],['🎁','Sorteio mensal'],['⭐','Bônus duplo'],['💳','Crédito na próxima carta'],['🎉','Experiência VIP']];
  var app=document.getElementById('app');
  var token=(new URLSearchParams(location.search).get('c')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  var info=null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rpc(nome,params){
    return fetch(SB_URL+'/rest/v1/rpc/'+nome,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(params)})
      .then(function(r){if(!r.ok) throw new Error('http '+r.status); return r.json();});
  }
  function estado(emoji,tit,txt){app.innerHTML='<div class="estado"><div class="big">'+emoji+'</div><h2>'+esc(tit)+'</h2><p>'+esc(txt)+'</p></div>';}
  function maskTel(el){
    var d=el.value.replace(/\D/g,'').slice(0,11);
    el.value=d.length>6?'('+d.slice(0,2)+') '+d.slice(2,d.length-4)+'-'+d.slice(-4):d.length>2?'('+d.slice(0,2)+') '+d.slice(2):d;
  }

  function render(){
    var n=Math.max(0,Math.min(5,info.restantes||0));
    var opts='<option value="">O que ele quer?</option>'+INTERESSES.map(function(i){return '<option>'+i+'</option>';}).join('');
    var linhas='';
    for(var i=0;i<n;i++){
      linhas+='<div class="am" data-i="'+i+'"><span class="num">Amigo '+(i+1)+'</span>'+
        '<input class="full" name="nome" placeholder="Nome do amigo" autocomplete="off" maxlength="80">'+
        '<input name="tel" type="tel" inputmode="numeric" placeholder="WhatsApp com DDD" autocomplete="off">'+
        '<select name="int" aria-label="O que ele quer conquistar">'+opts+'</select></div>';
    }
    app.innerHTML=
      '<div class="hero">'+
        (info.logo?'<img class="logo" src="'+esc(info.logo)+'" alt="" onerror="this.remove()"><br>':'')+
        (info.empresa?'<div class="emp">'+esc(info.empresa)+'</div>':'')+
        '<h1>'+(info.nome?esc(info.nome)+', indique seus amigos!':'Indique seus amigos!')+'</h1>'+
        '<p>Conhece alguém que quer comprar carro, imóvel, moto ou investir? Se um deles fechar, você ganha.</p>'+
      '</div>'+
      '<div class="body">'+
        '<div class="pix"><div class="pix-ic">💵</div><div><div class="pix-t">Prêmio em dinheiro</div><div class="pix-v">PIX de R$ 100 a R$ 1.000</div></div></div>'+
        '<div><div class="lbl" style="margin-bottom:8px">E ainda pode ganhar</div><div class="premios">'+
          PREMIOS.map(function(p){return '<div class="pr"><div class="e">'+p[0]+'</div><div class="n">'+esc(p[1])+'</div></div>';}).join('')+
        '</div></div>'+
        '<div><div class="lbl" style="margin-bottom:14px">Seus amigos (até '+n+')</div><form class="amigos" id="f" novalidate>'+linhas+
          '<div id="msg"></div>'+
          '<button class="btn" type="submit" id="enviar">Enviar indicações</button>'+
        '</form></div>'+
        '<p class="nota">O prêmio vale quando o indicado fecha negócio. Seu consultor te avisa.</p>'+
      '</div>';
    app.querySelectorAll('input[name=tel]').forEach(function(el){el.addEventListener('input',function(){maskTel(el);});});
    document.getElementById('f').addEventListener('submit',enviar);
  }

  function enviar(ev){
    ev.preventDefault();
    var msg=document.getElementById('msg'); msg.innerHTML='';
    var amigos=[], erro=false;
    app.querySelectorAll('.am').forEach(function(row){
      row.classList.remove('erro');
      var nome=row.querySelector('[name=nome]'), tel=row.querySelector('[name=tel]'), it=row.querySelector('[name=int]');
      nome.classList.remove('bad'); tel.classList.remove('bad');
      var vn=nome.value.trim(), vt=tel.value.replace(/\D/g,'');
      if(!vn&&!vt) return;
      var ok=true;
      if(vn.length<2){nome.classList.add('bad');ok=false;}
      if(vt.length<10||vt.length>11){tel.classList.add('bad');ok=false;}
      if(!ok){row.classList.add('erro');erro=true;return;}
      amigos.push({nome:vn,telefone:vt,interesse:it.value||'Outro'});
    });
    if(erro){msg.innerHTML='<div class="msg">Confira o nome e o WhatsApp com DDD dos amigos marcados.</div>';return;}
    if(!amigos.length){msg.innerHTML='<div class="msg">Preencha pelo menos um amigo.</div>';return;}
    var b=document.getElementById('enviar'); b.disabled=true; b.innerHTML='<span class="load"></span> Enviando…';
    rpc('ind_publico_enviar',{p_token:token,p_amigos:amigos}).then(function(r){
      if(r&&r.ok&&r.recebidos>0){
        estado('🎉','Indicações enviadas!','Obrigado! Vamos falar com '+(r.recebidos>1?'seus amigos':'seu amigo')+' em breve. Se fechar, você ganha o prêmio.');
      }else if(r&&r.ok){
        b.disabled=false; b.textContent='Enviar indicações';
        msg.innerHTML='<div class="msg">Esses amigos já tinham sido indicados por você.</div>';
      }else if(r&&r.motivo==='limite'){
        estado('✅','Você já indicou o máximo','Obrigado pelas indicações! Seu consultor vai te avisar quando alguém fechar.');
      }else{
        estado('🔗','Link indisponível','Peça um novo link para o seu consultor.');
      }
    }).catch(function(){
      b.disabled=false; b.textContent='Enviar indicações';
      msg.innerHTML='<div class="msg">Não consegui enviar agora. Verifique sua internet e tente de novo.</div>';
    });
  }

  if(!token){estado('🔗','Link incompleto','Abra o link exatamente como recebeu no WhatsApp.');return;}
  rpc('ind_publico_info',{p_token:token}).then(function(r){
    if(!r||!r.ok){estado('🔗','Link indisponível','Este link não está mais ativo. Peça um novo para o seu consultor.');return;}
    info=r;
    if(!r.restantes){estado('✅','Você já indicou o máximo','Obrigado pelas indicações! Seu consultor vai te avisar quando alguém fechar.');return;}
    render();
  }).catch(function(){estado('📶','Sem conexão','Não consegui abrir agora. Verifique sua internet e recarregue a página.');});
})();
</script>
</body>
</html>
