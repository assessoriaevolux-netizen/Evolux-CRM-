<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolux CRM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a1628;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .container{background:#111c2e;border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.5);border:1px solid #1e3a2f}
  .logo{text-align:center;margin-bottom:32px}
  .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#1db954,#16a34a);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px}
  .logo h1{color:#fff;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .logo p{color:#6b7280;font-size:13px;margin-top:4px}
  .field{margin-bottom:16px}
  .field label{display:block;color:#9ca3af;font-size:12px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .field input{width:100%;background:#0d1f35;border:1.5px solid #1e3a2f;border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none;transition:.2s}
  .field input:focus{border-color:#1db954}
  .field input::placeholder{color:#374151}
  .btn-login{width:100%;background:linear-gradient(135deg,#1db954,#16a34a);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s}
  .btn-login:hover{opacity:.9;transform:translateY(-1px)}
  .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .error{background:#1f0a0a;border:1px solid #7f1d1d;color:#fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .loading{display:none;text-align:center;color:#6b7280;font-size:13px;margin-top:12px}
  .divider{border:none;border-top:1px solid #1e3a2f;margin:24px 0}
  .footer{text-align:center;color:#374151;font-size:11px}
  .footer span{color:#1db954;font-weight:600}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <h1>Evolux CRM</h1>
    <p>O melhor CRM para consórcio</p>
  </div>
  <div class="error" id="error-msg"></div>
  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
  <div class="loading" id="loading">Entrando...</div>
  <hr class="divider">
  <div class="footer">Powered by <span>Evolux</span> · Todos os direitos reservados</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://uekeeutycmqsswrhspwv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nJ-BnFkD8sG8mv4f7Uc-Uw_v87ZOIl9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Verifica se já está logado
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) window.location.href='crm.html';
})();

async function fazerLogin(){
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  const erro=document.getElementById('error-msg');
  const btn=document.getElementById('btn-login');
  const loading=document.getElementById('loading');

  erro.style.display='none';
  if(!email||!senha){erro.textContent='Preencha e-mail e senha.';erro.style.display='block';return;}

  btn.disabled=true;
  loading.style.display='block';

  const {data,error}=await sb.auth.signInWithPassword({email,password:senha});

  if(error){
    erro.textContent='E-mail ou senha incorretos.';
    erro.style.display='block';
    btn.disabled=false;
    loading.style.display='none';
    return;
  }

  window.location.href='crm.html';
}

document.getElementById('senha').addEventListener('keydown',e=>{
  if(e.key==='Enter') fazerLogin();
});
</script>
</body>
</html>
